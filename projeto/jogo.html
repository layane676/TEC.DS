<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
        rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
        crossorigin="anonymous">
    <link rel="stylesheet" href="jogo.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Iosevka+Charon+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="card text-center">
            <div class="card-header" style="background-color:  rgb(9, 40, 54); color: aliceblue;">RPG Batalha épica
            </div>
            <div class="card-body" id="tela"
                style="background-image: url('assets/fundo.jpeg'); background-size: cover;">
                <p class="card-text"> Turno 1 </p>
                <div class="row">

                    <div class="col text-end" id="col-heroina">
                        <ul class="list-group float-start" style="width:225px;">
                            <li id="nome-heroina" class="list-group-item">Anabelle</li>
                            <li id="titulo-heroina" class="list-group-item">🗡️</li>
                            <li id="hp-heroina" class="list-group-item">❤️ <progress id="hp-hero" value="100" max="100"
                                    style="accent-color: red;"></progress></li>
                            <li id="mp-heroina" class="list-group-item">🧪 <progress id="mp-hero" value="100"
                                    max="100"></progress></li>
                            <li id="en-heroina" class="list-group-item">⚡ <progress id="en-hero" value="0" max="100"
                                    style="accent-color: orange;"></progress><br></li>
                        </ul>

                    </div>
                    <div class="col text-start" id="col-boss">
                        <ul class="list-group float-end" style="width: 225px;">
                            <li id="nome-boss" class="list-group-item">Caçador de almas</li>
                            <li id="titulo-boss" class="list-group-item">☠️</li>
                            <li id="hp-boss" class="list-group-item">🖤 <progress id="hp-boss" value="100" max="100"
                                    style="accent-color: red;"></progress></li>
                            <li id="en-boss" class="list-group-item">⚡ <progress id="en-boss" value="0" max="100"
                                    style="accent-color: orange;"></progress><br></li>
                        </ul>
                    </div>

                </div>

                <div class="row">
                    <div class="col text-end" id="col-botoes">
                        <div class="img-hero">
                            <img src="assets/anabelle.gif" width="400" height="400">
                        </div>
                        <div class="btn-group " id="controles">
                            <button class="btn ">Ataque</button>
                            <button class="btn ">Skill</button>
                            <button class="btn ">Ultimate</button>
                        </div>
                    </div>

                    <div class="col text-start" id="col-msg">
                        <div class="img-boss">
                            <img src="assets/boss.gif" width="350" height="350">
                        </div>
                    </div>

                </div>

            </div>

            <div class=" card-footer"> </div>
        </div>
    </div>
    </div>
</body>

</html>

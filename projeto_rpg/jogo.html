<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="jogo.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">


</head>

<body>
    <div class="container">
        <div class="card text-center">
            <div class="card-header" style="background-color: rgb(2, 41, 46); color: white;">
                <h1>RPG BATALHA ÉPICA</h1>
            </div>
            <div class="card-body" id="tela" style="background-image: url('assets/funfo2.gif');">
                <p class="card-text"> Turno 1</p>
                <div class="row">

                    <div class="col " id="col-heroi">
                        <div class="col text-end" id="col-heroi">
                            <ul class="list-group float-end" style="width: 225px ; ">
                                <li id="nome-heroi" class="list-group-item" > Anabelle </li>
                                <li id="titulo-heroi" class="list-group-item" >🗡️</li>
                                <li id="hp-heroi" class="list-group-item" >❤️<progress id="hp-heroi" value="100"max="100" style ></progress></li>
                                <li id="mp-heroi" class="list-group-item" >🧪<progress id="mp-heroi" value="50" max="50"style="accent-color:  red; "></progress></li>
                                <li id="energia-heroi" class="list-group-item" >⚡<progress id="energia-heroi" value="0"max="100" style="accent-color: yellow; "></progress></li>
                            </ul>
                        </div>
                    </div>

                    <div class="col" id="col-boss">
                        <div class="col text-start" id="col-boss">
                            <ul class="list-group float-start" style="width: 225px ;" >
                                <li id="nome-boss" class="list-group-item" >Caçador de almas</li>
                                <li id="titulo-boss" class="list-group-item" >💀🪄</li>
                                <li id="hp-boss" class="list-group-item" >❤️ <progress id="hp-boss" value="150" max="150" style="accent-color: red;"></progress> </li>
                                <li id="energia-boss" class="list-group-item">⚡<progress id="energia-boss" value="0"max="100" style="accent-color: yellow; "></progress></li>
                            </ul>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col text-end" id="col-ataque">
                            <div>
                            <img src="assets/hero.gif" width="300" height="300" alt="Hero">
                            </div>
                            <div class="btn-group" id="controles">
                                <button class="btn">Atacar</button>
                                <button class="btn">Skill</button>
                                <button class="btn">Ultimate</button>
                            </div>

                        </div>
                        <div class="col text-start" id="col-mensagem">
                            <img src="assets/vilaoo2.gif" width="300" height="300" alt="Boss">

                        </div>

                    </div>
                </div>
            </div>
            <div class="card-footer">
                <p>© 2023 RPG BATALHA ÉPICA. Todos os direitos reservados.</p>
            </div>
        </div>
    </div>

</body>

</html>
